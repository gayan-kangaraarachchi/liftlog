<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftlog</title>
<meta name="description" content="Gym workout tracker: routines, sets, rest timer, form videos and progress.">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liftlog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Lift<span>log</span></div>
    <div class="sync" id="sync"><i></i><span>Loading…</span></div>
  </header>
  <main id="main"></main>
</div>

<div class="rest" id="rest" hidden>
  <div class="rest-in">
    <div class="big" id="restTime">1:30</div>
    <div><div class="lbl" id="restLbl">Rest</div><div class="bar"><b id="restBar"></b></div></div>
    <div class="row" style="gap:4px;flex-wrap:nowrap">
      <button id="restMinus" aria-label="15 seconds less">−15</button>
      <button id="restPlus" aria-label="15 seconds more">+15</button>
      <button id="restSkip">Skip</button>
    </div>
  </div>
</div>

<nav class="tabs" aria-label="Sections"><div class="in2">
  <a href="#train" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Train</a>
  <a href="#routines" data-tab="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Routines</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Progress</a>
  <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</a>
</div></nav>

<div id="sheetHost"></div>


<script src="js/plan-parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
